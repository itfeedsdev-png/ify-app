# =============================================================================
# ify app - Docker Compose Configuration
# =============================================================================

services:
  ify-app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    image: ghcr.io/dakheera47/ify-app:latest
    container_name: ify-app
    ports:
      - "3005:3001"
    volumes:
      # Persist database and generated PDFs
      - ./data:/app/data
      # Persist Codex login/session data for app-server provider
      - codex-home:/app/codex-home
    environment:
      # Server config
      - NODE_ENV=production
      - PORT=3001

      # Python path (uses system python in container)
      - PYTHON_PATH=/usr/bin/python3
      # Codex runtime home (stores auth and config)
      - CODEX_HOME=/app/codex-home

    env_file:
      - path: ./.env
        required: false
    develop:
      watch:
        # Rebuild container when package.json changes
        - path: ./orchestrator/package.json
          action: rebuild
        - path: ./orchestrator/package-lock.json
          action: rebuild
        # Sync source code changes and rebuild inside container
        - path: ./orchestrator/src
          target: /app/orchestrator/src
          action: sync+restart
        - path: ./visa-sponsor-providers
          target: /app/visa-sponsor-providers
          action: sync+restart
        - path: ./career-boards/bamboohr/src
          target: /app/career-boards/bamboohr/src
          action: sync+restart
        - path: ./career-boards/workday/src
          target: /app/career-boards/workday/src
          action: sync+restart
        # Sync extractor changes
        - path: ./scrapes/gradcracker/src
          target: /app/scrapes/gradcracker/src
          action: sync+restart
        - path: ./scrapes/hiringcafe/src
          target: /app/scrapes/hiringcafe/src
          action: sync+restart
        - path: ./scrapes/ukvisajobs/src
          target: /app/scrapes/ukvisajobs/src
          action: sync+restart
        - path: ./scrapes/workingnomads/src
          target: /app/scrapes/workingnomads/src
          action: sync+restart
        - path: ./scrapes/golangjobs/src
          target: /app/scrapes/golangjobs/src
          action: sync+restart
        - path: ./scrapes/jobindex/src
          target: /app/scrapes/jobindex/src
          action: sync+restart
        - path: ./scrapes/seek/src
          target: /app/scrapes/seek/src
          action: sync+restart
        - path: ./scrapes/jobspy
          target: /app/scrapes/jobspy
          action: sync+restart
        - path: ./scrapes/naukri
          target: /app/scrapes/naukri
          action: sync+restart
        - path: ./scrapes/fiveamsat
          target: /app/scrapes/fiveamsat
          action: sync+restart
        - path: ./scrapes/wazzuf
          target: /app/scrapes/wazzuf
          action: sync+restart
        - path: ./scrapes/freehire/src
          target: /app/scrapes/freehire/src
          action: sync+restart
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

secrets:
  github_token:
    environment: GITHUB_TOKEN

# Volumes for data persistence
volumes:
  data:
  codex-home:
